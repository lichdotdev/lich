version: '3'

# lich is a pure-Go binary (no CGO), the backend; its window is lich-native,
# a separate cgo binary out of native/ that lich launches from beside itself
# (docs/native-window.md). Linux first; Windows and macOS supported.

vars:
  APP_NAME: "lich"
  BIN_DIR: "bin"
  # Package version follows the git tag (env VERSION overrides) — no manual bump.
  # The tag is trimmed in the template, not with sed: Task's shell is mvdan/sh
  # on every OS, and a plain Windows box has no sed on PATH — the pipeline would
  # fail silently and stamp an empty version into the binary.
  RAW_VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always 2>/dev/null)}"
  VERSION: '{{trimPrefix "v" .RAW_VERSION}}'
  # -X main.version stamps the git tag into the binary so the in-app update
  # check knows what it is running (dev builds via `go run` stay "dev").
  LDFLAGS: '-s -w -X main.version={{.VERSION}}'
  GO_BUILD_FLAGS: '-trimpath -ldflags "{{.LDFLAGS}}"'

tasks:
  build:
    desc: Build the static backend binary into bin/
    cmds:
      # {{exeExt}}: `go build -o bin/lich` writes exactly that name — no .exe —
      # and Windows then refuses to exec it (PATHEXT resolution needs the
      # extension), so `task run` fails on the binary `task build` just made.
      - cmd: CGO_ENABLED=0 go build {{.GO_BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}} .

  build:native:
    desc: Build the native window into bin/lich-native (cgo; libghostty-vt on PKG_CONFIG_PATH, native/slice.sh)
    # Its own module and binary, built with cgo (docs/native-window.md); it
    # never reaches the lich binary's build. The packages ship it beside lich,
    # where lich looks for it.
    dir: native
    cmds:
      - cmd: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o ../{{.BIN_DIR}}/lich-native ./cmd/lich-native

  build:native:windows:
    desc: Cross-build bin/lich-native.exe from Linux with Zig (native/build-windows.sh)
    cmds:
      - cmd: sh native/build-windows.sh ../{{.BIN_DIR}}/lich-native.exe

  icons:windows:
    desc: Regenerate rsrc_windows_amd64.syso from build/windows/lich.ico
    cmds:
      # The .syso is the resource the Windows executable links, and it is the
      # only source of the exe's icon: the Start Menu shortcut and the native
      # file picker (an in-process COM dialog) both draw it. Nothing rebuilds
      # it automatically, so a new lich.ico that skips this task ships an
      # executable still wearing the previous mark. lich.ico itself comes out
      # of build/appicon.py, with appicon.png and appicon-256.png.
      - cmd: go run github.com/akavel/rsrc@v0.10.2 -ico build/windows/lich.ico -arch amd64 -o rsrc_windows_amd64.syso

  build:windows:
    desc: Cross-compile the Windows binary
    cmds:
      # GUI subsystem: no console window rides along. stdout/stderr go
      # nowhere — the persistent lich.log is the diagnostic surface.
      - cmd: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "{{.LDFLAGS}} -H=windowsgui" -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .

  build:mac:
    desc: Cross-compile the macOS binaries
    cmds:
      # Both arches: Apple Silicon (arm64) and Intel (amd64). Pure Go, so both
      # cross-compile from any host. Unsigned — Gatekeeper quarantines until
      # notarization ships (INSTALL.md says what a user has to do about it).
      - cmd: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build {{.GO_BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}-darwin-arm64 .
      - cmd: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build {{.GO_BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}-darwin-amd64 .

  bundle:mac:
    desc: Wrap the macOS binary and the window in bin/Lich.app (macOS host only)
    deps: [build:mac]
    # The native window builds apart (cgo, libghostty-vt), as for package.
    preconditions:
      - sh: test -x {{.BIN_DIR}}/lich-native
        msg: "bin/lich-native is missing: task build:native puts it there"
    cmds:
      # The binary cross-compiles from anywhere; the bundle needs Apple's sips
      # and iconutil for the icon, so this task only runs on a Mac.
      - cmd: build/darwin/bundle.sh {{.BIN_DIR}}/{{.APP_NAME}}-darwin-{{ARCH}} {{.VERSION}} {{.BIN_DIR}} {{.BIN_DIR}}/lich-native

  run:
    desc: Build and run
    deps: [build, build:native]
    cmds:
      - cmd: ./{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}

  dev:
    desc: Dev mode — the native window on a backend with its own DB and port
    deps: [build:native]
    cmds:
      # Dev isolation: separate DB (LICH_DEV, store.databasePath) and listener
      # port, so a daily-driver lich keeps running untouched; LICH_DEV also
      # gives the window its own class, lichdev. go run leaves the binary in a
      # temp dir, where nothing sits beside it; the pin names the window
      # build:native made. The build reports "dev" unless VERSION is set:
      # `VERSION=Unreleased task dev` is how the What's new dialog is smoked
      # against the [Unreleased] changelog section, `VERSION=v0.44.0` against
      # a release.
      - cmd: LICH_DEV=1 LICH_LISTEN_PORT=47822 LICH_NATIVE="{{.ROOT_DIR}}/{{.BIN_DIR}}/lich-native" go run {{if env "VERSION"}}-ldflags "-X main.version={{.VERSION}}" {{end}}.

  gallery:
    desc: Build the UI kit gallery into bin/lich-gallery and open it (cgo, no libghostty-vt)
    cmds:
      - cmd: cd native && CGO_ENABLED=1 go build -trimpath -o ../{{.BIN_DIR}}/lich-gallery ./cmd/ui-gallery
      - cmd: LICH_GALLERY="{{.ROOT_DIR}}/{{.BIN_DIR}}/lich-gallery" go run . gallery

  test:
    desc: Run the backend and native window suites (native needs libghostty-vt on PKG_CONFIG_PATH)
    cmds:
      - cmd: go test ./...
      - cmd: cd native && go test ./...

  pricing:refresh:
    desc: Reprice internal/pricing/prices.json from LiteLLM — run it when cutting a release
    cmds:
      # The baked floor is what an offline install prices with, so it drifts from
      # the day it ships. This only reprices the ids already in the file; which
      # models the floor carries stays a hand-picked list.
      - cmd: go run internal/pricing/genfloor.go

  stats:
    desc: Downloads per release and OS from GitHub Releases, the AUR package and clone traffic (needs gh)
    preconditions:
      - sh: command -v gh
        msg: "gh is required: https://cli.github.com"
    cmds:
      # Downloads count installs and updates through the package's own asset; a
      # Homebrew, Scoop or AUR update fetches the same files, so this is downloads,
      # not people. Checksums and update manifests are left out of the count.
      - cmd: |
          gh api --paginate repos/lichdotdev/lich/releases --jq '
            .[] | select(.prerelease | not)
            | [.assets[] | select(.name | test("checksums|SHA256SUMS|\\.json$") | not)] as $a
            | def os($re): [$a[] | select(.name | test($re)) | .download_count] | add // 0;
            [.tag_name, .published_at[:10], os("."), os("linux|\\.deb$|\\.rpm$|pkg\\.tar"), os("windows"), os("darwin")]
            | @tsv' | awk 'BEGIN { print "release\tdate\ttotal\tlinux\twindows\tmac" } { print; t += $3 } END { print "all\t\t" t }' | column -t
      - cmd: |
          curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=lich-bin' | jq -r '.results[] | "AUR \(.Name) \(.Version): \(.NumVotes) votes, popularity \(.Popularity)"'
      # GitHub keeps only the last 14 days and needs push access to the repo.
      # Every CI checkout is a clone too, so the totals lean on our own runs.
      - cmd: |
          gh api repos/lichdotdev/lich/traffic/clones --jq '"Clones, last 14 days: \(.count) total, \(.uniques) unique", (.clones[] | "  \(.timestamp[:10])  \(.count)  \(.uniques) unique")'

  mutation:
    desc: Mutation tests via gremlins — .gremlins.yaml, scope with -- ./internal/pkg/
    preconditions:
      - sh: command -v gremlins
        msg: "gremlins is required: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest"
    cmds:
      # No path → whole module (slow: single-worker, terminal spawns real PTYs).
      # Scope a run with: task mutation -- ./internal/store/
      - cmd: gremlins unleash {{.CLI_ARGS}}

  package:
    desc: Build the Linux packages (deb, rpm, archlinux)
    deps: [build]
    # The native window builds apart (cgo), in CI on an older glibc than a
    # developer's machine: it is put in bin/ first, not rebuilt here.
    preconditions:
      - sh: test -x {{.BIN_DIR}}/lich-native
        msg: "bin/lich-native is missing: task build:native puts it there"
    cmds:
      - task: package:nfpm
        vars: { FORMAT: deb, TARGET: '{{.APP_NAME}}.deb' }
      - task: package:nfpm
        vars: { FORMAT: rpm, TARGET: '{{.APP_NAME}}.rpm' }
      - task: package:nfpm
        vars: { FORMAT: archlinux, TARGET: '{{.APP_NAME}}.pkg.tar.zst' }

  package:windows:
    desc: Build bin/lich-setup.exe with the window inside (needs Inno Setup 6, on Windows)
    deps: [build:windows]
    preconditions:
      - sh: command -v iscc
        msg: "iscc (Inno Setup 6) is required — on Windows: choco install innosetup"
      - sh: test -f {{.BIN_DIR}}/lich-native.exe
        msg: "bin/lich-native.exe is missing: task build:native:windows cross-builds it from Linux"
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - cmd: iscc build/windows/lich.iss

  package:nfpm:
    internal: true
    preconditions:
      - sh: command -v nfpm
        msg: "nfpm is required: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest"
    env:
      VERSION: '{{.VERSION}}'
      GOARCH: amd64
    cmds:
      - cmd: nfpm package -f build/linux/nfpm/nfpm.yaml -p {{.FORMAT}} -t {{.BIN_DIR}}/{{.TARGET}}
