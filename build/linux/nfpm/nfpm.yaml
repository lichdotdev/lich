# nfpm config for the lich packages (deb, rpm, archlinux) — invoked directly
# by the root Taskfile (`task package`). The binary is static pure Go and the
# window (bin/lich-native, cgo) ships beside it; zenity and git stay soft
# (recommends where the format supports it) so installs never block.

name: "lich"
arch: ${GOARCH}
platform: "linux"
# Follows the git tag via $VERSION (injected by the Taskfile) — no manual bump.
version: "${VERSION}"
section: "default"
priority: "extra"
maintainer: "omartelo <meopedevts@proton.me>"
description: "Run your coding agents side by side, each on its own branch"
vendor: "lich"
homepage: "https://github.com/lichdotdev/lich"
license: "AGPL-3.0-only"

contents:
  - src: "./bin/lich"
    dst: "/usr/local/bin/lich"
  # Beside lich, where lich looks for it.
  - src: "./bin/lich-native"
    dst: "/usr/local/bin/lich-native"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/lich.png"
  - src: "./build/linux/lich.desktop"
    dst: "/usr/share/applications/lich.desktop"

# gh is deliberately absent: it is optional (pull requests only) and packaged
# under a different name on each distribution, so a recommends here would name
# the wrong package as often as the right one. INSTALL.md and the app both
# point at cli.github.com instead.
recommends:
  - zenity
  - git

# What the native window links against (`objdump -p bin/lich-native`), plus
# fontconfig, whose fc-match it asks for the system fonts. rpm takes sonames,
# which resolve on Fedora, openSUSE and RHEL alike where package names do not.
# build/linux/aur/PKGBUILD.tpl carries the archlinux list too.
overrides:
  deb:
    depends:
      - libc6 (>= 2.34)
      - libegl1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxfixes3
      - fontconfig
  rpm:
    depends:
      - libc.so.6(GLIBC_2.34)(64bit)
      - libEGL.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXfixes.so.3()(64bit)
      - fontconfig
  archlinux:
    depends:
      - glibc
      - libglvnd
      - wayland
      - libxkbcommon
      - libxkbcommon-x11
      - libx11
      - libxcursor
      - libxfixes
      - fontconfig

# xz rather than the gzip default: smaller packages, and unlike zstd every
# dpkg and rpm still in use unpacks it.
deb:
  compression: xz
rpm:
  compression: xz

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
