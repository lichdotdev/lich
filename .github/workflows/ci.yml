name: ci

# Per-PR gate for the backend: format/vet + the suite on linux, with pass/fail
# counts and coverage rendered into the job summary, plus the suite on windows
# and macOS in parallel (os-tests below). The native window's gate is
# native.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: these files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Per-PR CI runs on Linux only; the Windows and macOS suites run at release
      # time. Compile every OS's build here so a broken build tag — a _test.go
      # that falls into the wrong OS's build, an OS-only file that stops
      # compiling — fails the PR instead of a release tag. vet builds the
      # _test.go files too, so it catches test-only tag mistakes `go build` misses.
      - name: Cross-compile all targets
        run: |
          for os in linux darwin windows; do
            echo "== $os =="
            CGO_ENABLED=0 GOOS=$os go build ./...
            CGO_ENABLED=0 GOOS=$os go vet ./...
          done

      # The RPC and /events contract is api/, recorded in
      # api/testdata/contract.golden. Its own step so a PR that moves it without
      # the golden fails by name and shows what moved, rather than as one red
      # test among the suite's.
      - name: API contract
        run: |
          if ! go test -run '^(TestContractMatchesGolden|TestEveryRequestIsOneObject|TestWireShapesAreWhatMarshalJSONWrites)$' ./api; then
            go test -run '^TestContractMatchesGolden$' ./api -update > /dev/null
            echo "::error::the api contract moved without api/testdata/contract.golden: run go test ./api -update and commit the diff below"
            git diff -- api/testdata/contract.golden
            exit 1
          fi

      - name: Backend tests
        run: bash .github/scripts/go-test-summary.sh linux

  # The backend suite on the OSes the linux job cannot speak for. The
  # cross-compile step above proves every target still builds; only a real runner
  # proves it still passes — v0.18.0 shipped a path guard that read a rooted path
  # as relative on Windows, and the tag's release build was the first thing to
  # say so.
  #
  # On every PR and every merge, because opting in never worked: it asked the
  # author to know which code reads a per-OS location, and the one who did not
  # left main red for four merges (#220 → #224). It costs about ten seconds —
  # this runs beside the linux job, which takes longer than either of these — and
  # the runners are free on a public repository.
  os-tests:
    strategy:
      # One red OS still reports the other, rather than cancelling it.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # git-bash on Windows keeps these steps byte-identical to the linux job's.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Backend tests
        run: bash .github/scripts/go-test-summary.sh ${{ matrix.os }}

      - name: Windows installer self-update end to end
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: go test -tags installer_e2e -run '^TestWindowsInstallerE2E$' -v -timeout 10m ./internal/appupdate
