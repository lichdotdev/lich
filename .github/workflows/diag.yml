name: diag
on: [pull_request]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run TestZZDiagSlowReader -v ./internal/terminal/ | grep -E 'dup=|ok|FAIL'
