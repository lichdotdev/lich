# Temporary: measures the macOS held-dialog pane failure. Removed before merge.
name: measure-tmp
on:
  pull_request:
    paths: ['.github/workflows/measure-tmp.yml', 'internal/browser/**']
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
        suite:
          - {name: pane, run: '^TestChromeAPaneOpenedOnADialogShowsThePage$', count: 50}
          - {name: chrome, run: 'TestChrome', count: 5}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.runner }} ${{ matrix.suite.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Measure
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version || true
          go test -v -timeout 80m -count=${{ matrix.suite.count }} -run '${{ matrix.suite.run }}' ./internal/browser/ > out.txt 2>&1; code=$?
          echo "TALLY PASS=$(grep -c -- '^--- PASS' out.txt) FAIL=$(grep -c -- '^--- FAIL' out.txt)"
          grep -- '--- FAIL\|_test.go:' out.txt || true
          exit $code
