name: native-egl-loop

# TEMPORARY: measures the eglInitialize 0x3001 flake of the native render
# tests. Removed before the PR is ready.
on:
  pull_request:
    paths: [native/**, .github/workflows/native-egl-loop.yml]

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, noreset]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev \
            libgl1-mesa-dri libegl-mesa0 xvfb fontconfig fonts-dejavu-core
      - name: Pinned Ghostty commit
        id: ghostty
        run: echo "commit=$(cat GHOSTTY_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Cache libghostty-vt
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/libghostty-vt
          key: libghostty-vt-${{ runner.os }}-${{ steps.ghostty.outputs.commit }}
      - name: Set up Zig
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build libghostty-vt
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          git init ghostty
          cd ghostty
          git fetch --depth 1 https://github.com/ghostty-org/ghostty "${{ steps.ghostty.outputs.commit }}"
          git checkout FETCH_HEAD
          zig build -Demit-lib-vt -Doptimize=ReleaseFast --prefix ~/libghostty-vt
      - name: Point pkg-config at libghostty-vt
        run: echo "PKG_CONFIG_PATH=$HOME/libghostty-vt/share/pkgconfig" >> "$GITHUB_ENV"
      - name: Warm build
        run: go test -count=1 -run XXX ./...
      - name: Loop
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_LOG_LEVEL: debug
          VARIANT: ${{ matrix.variant }}
        run: |
          srv="$(sed -n 's/^XVFBARGS="\(.*\)"/\1/p' "$(command -v xvfb-run)")"; echo "xvfb-run default: $srv"
          [ "$VARIANT" = noreset ] && srv="-noreset $srv"
          N=80
          runs=0; badruns=0; skips=0
          for i in $(seq $N); do
            ( peak=0; while :; do n=$(ss -xH | grep -c X11-unix || true); [ "$n" -gt "$peak" ] && { peak=$n; echo $peak > peak.txt; }; sleep 0.05; done ) & sampler=$!
            : > peak.txt; : > xvfb.err
            xvfb-run -a -s "$srv" -e xvfb.err go test -count=1 -v ./... > run.log 2>&1 || { echo "run $i exit $?"; tail -50 run.log; }
            kill $sampler; echo "run $i peak X sockets: $(cat peak.txt)"
            echo "run $i server generations: $(grep -c 'xkbcomp) reports' xvfb.err || true)"
            s=$(grep -c 'no headless GPU' run.log || true)
            runs=$((runs+1)); skips=$((skips+s)); [ "$s" -gt 0 ] && badruns=$((badruns+1))
            if [ "$s" -gt 0 ]; then
              echo "=== run $i: $s skip(s)"
              grep -B40 'no headless GPU' run.log | grep -v '^--- PASS' | tail -120
            fi
          done
          echo "RESULT variant=$VARIANT runs=$runs badruns=$badruns skips=$skips"
          grep -c -- '--- PASS' run.log | sed 's/^/passes in last run: /'
