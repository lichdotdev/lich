name: release

on:
  push:
    tags:
      - "v*"
      # A pre-release (v0.68.0-pre.1) is built and uploaded by hand: running this
      # would publish it to the AUR, Homebrew and every install's updater.
      - "!v*-*"
    # A tag run only restores caches saved on its own ref or on main, so the
    # libghostty-vt builds it saves are never seen by the next tag: without
    # this every release rebuilds them (~14 min on the Intel mac). A run on
    # main saves them where tags can read them, and publishes nothing (the
    # release job is tag-only). Paths are ignored on tag pushes.
    branches: [main]
    paths: [native/GHOSTTY_COMMIT, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The native window (native/, cgo: Gio and libghostty-vt) for both systems,
  # built first and handed to the jobs that package it beside lich. Linux
  # builds on the oldest supported runner: its glibc is the floor the binary
  # asks of a user's machine. Windows is cross-built with Zig
  # (native/build-windows.sh), as native.yml proves on every PR. macOS needs
  # Apple's SDK, so its native window builds in the mac job.
  native:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Gio's Linux headers; see native.yml.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Pinned Ghostty commit
        id: ghostty
        run: echo "commit=$(cat GHOSTTY_COMMIT)" >> "$GITHUB_OUTPUT"

      # Keyed apart from native.yml's: that one is built on ubuntu-latest, and
      # its glibc would raise the floor.
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: |
            ~/libghostty-vt
            ~/libghostty-vt-windows
          key: libghostty-vt-release-ubuntu-22.04-baseline-${{ steps.ghostty.outputs.commit }}

      - name: Build libghostty-vt
        run: |
          if [ "$(cat ~/libghostty-vt/.commit 2>/dev/null)" != "${{ steps.ghostty.outputs.commit }}" ]; then
            src="$RUNNER_TEMP/ghostty"
            git init -q "$src"
            git -C "$src" fetch -q --depth 1 https://github.com/ghostty-org/ghostty "${{ steps.ghostty.outputs.commit }}"
            git -C "$src" checkout -q FETCH_HEAD
            # Without a target zig builds for the runner's own CPU, and a runner
            # with AVX-512 ships a window that dies with SIGILL everywhere else.
            (cd "$src" && zig build -Demit-lib-vt -Doptimize=ReleaseFast -Dcpu=baseline --prefix ~/libghostty-vt)
            echo "${{ steps.ghostty.outputs.commit }}" > ~/libghostty-vt/.commit
          fi

      - name: Build lich-native (linux, windows)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          PKG_CONFIG_PATH="$HOME/libghostty-vt/share/pkgconfig" CGO_ENABLED=1 \
            go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/out/lich-native" ./cmd/lich-native
          LIBGHOSTTY_VT_WINDOWS="$HOME/libghostty-vt-windows" ./build-windows.sh "$RUNNER_TEMP/out/lich-native.exe"

      # libghostty-vt is linked in, and nothing asks for a glibc newer than the
      # 2.34 the packages require (build/linux/nfpm/nfpm.yaml, README): the
      # runner's own 2.35 is not the promise.
      - name: Check what lich-native asks of a machine
        run: |
          bin="$RUNNER_TEMP/out/lich-native"
          if objdump -p "$bin" | grep NEEDED | grep -qi ghostty; then
            echo "::error::lich-native links libghostty-vt dynamically"; objdump -p "$bin" | grep NEEDED; exit 1
          fi
          floor="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "lich-native asks for $floor"
          [ "$(printf '%s\nGLIBC_2.34\n' "$floor" | sort -V | tail -1)" = GLIBC_2.34 ] || {
            echo "::error::lich-native asks for $floor, newer than the 2.34 the packages promise"; exit 1
          }

      - name: Upload lich-native
        uses: actions/upload-artifact@v7
        with:
          name: lich-native
          path: ${{ runner.temp }}/out/lich-native*

  # linux and windows build in parallel once the native window is built;
  # release fans in and publishes.
  linux:
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs the tag history for the package version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Packaging needs task and nfpm.
      #
      # GOTOOLCHAIN=auto only here: setup-go exports `local`, which is right for
      # building lich (it holds every go command to the go.mod line) but breaks
      # installing these tools, since `@latest` resolves to releases that ask for
      # a newer Go than we declare. Scoped to the step because setup-go writes
      # `local` through GITHUB_ENV, which outranks a workflow-level env.
      - name: Install task and nfpm
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Ubuntu 24.04 refuses unprivileged user namespaces to binaries without an
      # AppArmor profile, the runner's Chromium among them, and Chromium will not
      # start without its sandbox: the internal/browser live tests need it.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The suite emits pass/fail counts + coverage into the job summary and
      # still fails the job on a red test (shared with ci.yml).
      - name: Backend tests
        run: bash .github/scripts/go-test-summary.sh linux

      - name: Download lich-native
        uses: actions/download-artifact@v8
        with:
          name: lich-native
          path: bin

      - name: Build Linux packages
        run: |
          chmod +x bin/lich-native
          rm bin/lich-native.exe
          task package

      - name: Assemble Linux assets
        run: |
          cd bin
          # workflow_dispatch runs land here with a branch name; slashes would
          # break the file names.
          tag="${GITHUB_REF_NAME//\//-}"
          mv "lich.deb"             "lich-${tag}-amd64.deb"
          mv "lich.rpm"             "lich-${tag}-x86_64.rpm"
          mv "lich.pkg.tar.zst"     "lich-${tag}-x86_64.pkg.tar.zst"
          # The tarball is a complete package, the binary with its window
          # beside it; the AUR PKGBUILD installs from it too. The env is how
          # tar's zstd takes a level. Threads spelled out: unlike -T0,
          # ZSTD_NBTHREADS=0 is one thread.
          ZSTD_CLEVEL=19 ZSTD_NBTHREADS="$(nproc)" tar --zstd -cf "lich-${tag}-linux-amd64.tar.zst" lich lich-native
          ls -la lich-${tag}-*

      - name: Upload Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: lich-linux
          path: bin/lich-*

  windows:
    needs: [native]
    runs-on: windows-latest
    defaults:
      run:
        # bash (git-bash) keeps the steps byte-identical to the linux job's.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GOTOOLCHAIN=auto for the tool install only — see the linux job.
      - name: Install task and Inno Setup
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          choco install innosetup -y --no-progress

      - name: Download lich-native
        uses: actions/download-artifact@v8
        with:
          name: lich-native
          path: bin

      - name: Build Windows binary + installer
        run: |
          rm bin/lich-native
          task package:windows

      - name: Backend tests (windows)
        run: bash .github/scripts/go-test-summary.sh windows

      # End to end on the runner before the assets ship: the installer installs
      # silently, lich.exe finds the window beside itself and opens it, the
      # window closes on a plain close request while lich keeps its sessions
      # running, a launch opens a new window on it, and `lich quit` ends both.
      # Its config lives under an APPDATA of its own.
      - name: Install and run lich end to end
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          bin/lich-setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="$RUNNER_TEMP/setup.log"
          app="$LOCALAPPDATA/Programs/lich"
          test -f "$app/lich.exe" && test -f "$app/lich-native.exe"
          export APPDATA="$RUNNER_TEMP/appdata" LICH_LISTEN_PORT=47899
          config="$APPDATA/lich"
          mkdir -p "$APPDATA"
          fail() { echo "::error::$1"; cat "$config/lich.log" "$config/lich-native.log" 2>/dev/null; exit 1; }
          "$app/lich.exe" &
          for _ in $(seq 1 30); do sleep 1; test -s "$config/runtime.json" && break; done
          test -s "$config/runtime.json" || fail "lich never wrote runtime.json"
          # Ask, the default, holds a close with a session running behind a
          # dialog nobody here answers. Keep running is stored, and the window
          # reads it once at its start, so lich is quit and launched again.
          for _ in $(seq 1 60); do sleep 1; grep -q 'native window attached' "$config/lich.log" && break; done
          grep -q 'native window attached' "$config/lich.log" || fail "lich did not open its first window"
          token=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' "$config/runtime.json")
          curl -fsS -X POST -H 'Content-Type: application/json' -d '[{"key":"window.closeAction","projectId":"","value":"background"}]' \
            "http://127.0.0.1:$LICH_LISTEN_PORT/rpc/store.SetSetting?token=$token" > /dev/null || fail "storing Keep running failed"
          "$app/lich.exe" quit || fail "the first lich quit exited $?"
          for _ in $(seq 1 10); do tasklist | grep -q -e '^lich.exe' -e lich-native.exe || break; sleep 1; done
          tasklist | grep -e '^lich.exe' -e lich-native.exe && fail "lich outlived the first lich quit"
          rm -f "$config/runtime.json" "$config/lich.log"
          "$app/lich.exe" &
          for _ in $(seq 1 30); do sleep 1; test -s "$config/runtime.json" && break; done
          test -s "$config/runtime.json" || fail "the second launch never wrote runtime.json"
          for _ in $(seq 1 60); do sleep 1; grep -q 'native window attached' "$config/lich.log" && break; done
          grep -q 'native window attached' "$config/lich.log" || fail "lich did not open its window"
          sleep 10
          tasklist | grep -q lich-native.exe || fail "the window died"
          # Closing the window leaves lich running with its sessions; with none
          # running it would quit, so one is opened first, through the CLI as an
          # agent would. A close request, not a kill: what the user's close is.
          mkdir -p "$RUNNER_TEMP/proj"
          "$app/lich.exe" open --project "$RUNNER_TEMP/proj" --kind shell || fail "lich open exited $?"
          taskkill /IM lich-native.exe > /dev/null
          for _ in $(seq 1 15); do sleep 1; tasklist | grep -q lich-native.exe || break; done
          tasklist | grep -q lich-native.exe && fail "the window outlived its close request"
          sleep 2
          tasklist | grep -q '^lich.exe' || fail "lich exited with its window"
          # Launched again, lich asks the running one for its window, and that
          # backend opens it.
          "$app/lich.exe" || fail "the reopening launch exited $?"
          for _ in $(seq 1 30); do sleep 1; tasklist | grep -q lich-native.exe && break; done
          tasklist | grep -q lich-native.exe || fail "a second launch did not reopen the window on the running lich"
          "$app/lich.exe" quit || fail "lich quit exited $?"
          for _ in $(seq 1 10); do tasklist | grep -q '^lich.exe' || break; sleep 1; done
          tasklist | grep -q '^lich.exe' && fail "lich.exe is still running after lich quit"
          for _ in $(seq 1 10); do tasklist | grep -q lich-native.exe || break; sleep 1; done
          tasklist | grep -q lich-native.exe && fail "the window outlived lich quit"
          echo "lich opened its window, kept running without it, reopened it and quit"

      - name: Assemble Windows assets
        run: |
          cd bin
          tag="${GITHUB_REF_NAME//\//-}"
          mv lich-setup.exe "lich-${tag}-windows-amd64-setup.exe"
          # The portable package: lich.exe with lich-native.exe beside it, the
          # layout the installer lays down.
          7z a -bso0 -bsp0 "lich-${tag}-windows-amd64.zip" lich.exe lich-native.exe
          ls -la lich-${tag}-*

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: lich-windows
          path: bin/lich-*

  # One job per architecture, each on a runner of that architecture: the
  # window is cgo against Apple's SDK, built natively, and the bundle is run
  # end to end on the machine it is for before it ships. macos-latest is Apple
  # Silicon; macos-15-intel is the last Intel runner GitHub hosts.
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            zig: aarch64
            runner: macos-latest
          - arch: amd64
            zig: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      # The floor Info.plist and the cask promise (INSTALL.md, macOS); cgo's
      # clang otherwise targets the runner's own macOS.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GOTOOLCHAIN=auto for the tool install only — see the linux job.
      - name: Install task
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # macOS is Unix, so this runs the real PTY tests on both architectures.
      - name: Backend tests (macos)
        run: bash .github/scripts/go-test-summary.sh macos

      # Pure Go: both architectures cross-compile in seconds, and only this
      # job's own is bundled below.
      - name: Build macOS binaries
        run: task build:mac

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Pinned Ghostty commit
        id: ghostty
        run: echo "commit=$(cat native/GHOSTTY_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: ~/libghostty-vt
          key: libghostty-vt-release-macos-${{ matrix.arch }}-${{ steps.ghostty.outputs.commit }}

      - name: Build libghostty-vt
        run: |
          if [ "$(cat ~/libghostty-vt/.commit 2>/dev/null)" != "${{ steps.ghostty.outputs.commit }}" ]; then
            src="$RUNNER_TEMP/ghostty"
            git init -q "$src"
            git -C "$src" fetch -q --depth 1 https://github.com/ghostty-org/ghostty "${{ steps.ghostty.outputs.commit }}"
            git -C "$src" checkout -q FETCH_HEAD
            (cd "$src" && zig build -Demit-lib-vt -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig }}-macos.13.0 --prefix ~/libghostty-vt)
            echo "${{ steps.ghostty.outputs.commit }}" > ~/libghostty-vt/.commit
          fi

      # The window (cgo: Gio's Cocoa and Metal, libghostty-vt), built on the
      # runner of its own architecture.
      - name: Build lich-native (${{ matrix.arch }})
        working-directory: native
        run: |
          PKG_CONFIG_PATH="$HOME/libghostty-vt/share/pkgconfig" CGO_ENABLED=1 \
            go build -trimpath -ldflags "-s -w" -o ../bin/lich-native ./cmd/lich-native
          bash ../.github/scripts/mac-native-floor.sh ../bin/lich-native

      # The .app the cask installs. The binaries it is built from are removed
      # so the upload below cannot pick them up.
      - name: Assemble macOS assets
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd bin
          tag="${GITHUB_REF_NAME//\//-}"
          ../build/darwin/bundle.sh "lich-darwin-${ARCH}" "${tag#v}" stage lich-native
          # ditto, not zip: it is the archiver that keeps a bundle's symlinks,
          # permissions and signature intact for Homebrew Cask to unpack.
          ditto -c -k --keepParent stage/Lich.app "lich-${tag}-darwin-${ARCH}.zip"
          rm lich-darwin-arm64 lich-darwin-amd64 lich-native
          ls -la lich-${tag}-*

      # End to end on the runner before the assets ship; the script says what
      # it proves.
      - name: Run Lich.app end to end
        run: bash .github/scripts/mac-e2e.sh bin/stage/Lich.app

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lich-macos-e2e-${{ matrix.arch }}
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: lich-macos-${{ matrix.arch }}
          path: bin/lich-*

  release:
    needs: [linux, windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Checkout for CHANGELOG.md — the notes come from it — and to prove the
      # banner is still where the notes are about to point at it.
      - uses: actions/checkout@v7

      - name: Download build assets
        uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      # lich-v* and not lich-*: bin/ also holds the lich-native artifact the
      # packages were built with, which is not an asset of its own.
      - name: Checksums
        run: |
          cd bin
          sha256sum lich-v* > checksums.txt
          cat checksums.txt

      # Rendered here rather than in a job of its own like the cask: the
      # checksums are already in hand, and the manifest ships in the same
      # `gh release create` as the assets it hashes, so a release never exists
      # without it. The install URL is releases/latest/download/lich.json, so
      # nothing on a branch has to move for Scoop to see a new tag.
      - name: Render Scoop manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          sum() {
            awk -v file="$1" '$2 == file { print $1 }' bin/checksums.txt
          }
          zip="$(sum "lich-v${version}-windows-amd64.zip")"
          # An empty hash would publish a manifest that fails every install.
          if [ -z "$zip" ]; then
            echo "missing windows checksums in checksums.txt" >&2
            cat bin/checksums.txt >&2
            exit 1
          fi
          sed -e "s/@VERSION@/${version}/g" \
              -e "s/@SHA_ZIP@/${zip}/" \
              build/windows/scoop/lich.json.tpl > bin/lich.json
          jq . bin/lich.json

      # The notes open with the same banner the site and the social cards use.
      # It is addressed at this tag's tree, not at a branch, so a release keeps
      # the banner it shipped with however the file changes later.
      - name: Compose release notes
        env:
          BANNER: docs/media/og.png
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > body.md
          fi
          # A moved or renamed banner would otherwise put a broken image at the
          # top of this release and of every one after it, with nothing to
          # notice it but a reader.
          if [ ! -f "$BANNER" ]; then
            echo "banner not found at $BANNER" >&2
            exit 1
          fi
          {
            printf '<img src="https://raw.githubusercontent.com/%s/%s/%s" alt="lich: run your coding agents side by side, each on its own branch" width="900" />\n\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$BANNER"
            cat body.md
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bin/lich-v* bin/checksums.txt bin/lich.json \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  # The AUR PKGBUILD sources point at the GitHub Release assets, so this runs
  # only after `release` publishes them. updpkgsums fills the checksums by
  # downloading those assets; the action then regenerates .SRCINFO and pushes
  # to the lich-bin AUR repo over SSH.
  aur:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render PKGBUILD
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/${version}/" build/linux/aur/PKGBUILD.tpl > PKGBUILD

      - name: Publish lich-bin to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: lich-bin
          pkgbuild: ./PKGBUILD
          updpkgsums: true
          commit_username: omartelo
          commit_email: meopedevts@proton.me
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"

  # The cask pins the macOS assets by checksum, so it can only be rendered
  # once `release` has published them and their checksums.txt.
  # HOMEBREW_TAP_SSH_KEY is a deploy key with write access on
  # lichdotdev/homebrew-tap — GITHUB_TOKEN is scoped to this repository and cannot
  # push to another one. A deploy key, unlike a PAT, reaches exactly that one
  # repository and never expires, so a release years from now still publishes.
  homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt
          sum() {
            awk -v file="$1" '$2 == file { print $1 }' checksums.txt
          }
          arm64="$(sum "lich-v${version}-darwin-arm64.zip")"
          amd64="$(sum "lich-v${version}-darwin-amd64.zip")"
          # An empty checksum would publish a cask that fails every install.
          if [ -z "$arm64" ] || [ -z "$amd64" ]; then
            echo "missing darwin checksums in checksums.txt" >&2
            cat checksums.txt >&2
            exit 1
          fi
          sed -e "s/@VERSION@/${version}/g" \
              -e "s/@SHA_ARM64@/${arm64}/" \
              -e "s/@SHA_AMD64@/${amd64}/" \
              build/darwin/homebrew/lich.rb.tpl > lich.rb
          cat lich.rb

      - name: Publish lich to the tap
        env:
          SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          key="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          known="$(mktemp)"
          ssh-keyscan -t ed25519 github.com > "$known" 2>/dev/null
          # IdentitiesOnly keeps ssh from offering the runner's other keys first
          # and getting rejected before this one is tried.
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known"
          git clone --depth 1 git@github.com:lichdotdev/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp lich.rb tap/Casks/lich.rb
          cd tap
          git config user.name omartelo
          git config user.email meopedevts@proton.me
          git add Casks/lich.rb
          # A re-run of the same tag renders an identical cask; nothing to push.
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "lich: update to ${GITHUB_REF_NAME}"
          git push
